name: Deploy to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Ensure DNS zone exists for medrepartners.com
        run: doctl compute domain create medrepartners.com --output json || true

      - name: Deploy app from do/app.yaml
        uses: digitalocean/app_action/deploy@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_spec_location: do/app.yaml
          print_build_logs: true
          print_deploy_logs: true

      - name: Show app URL
        run: doctl apps list --format ID,Spec.Name,DefaultIngress,ActiveDeployment.Phase
